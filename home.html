<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Welcome · EvoCoder Auth Demo</title>
    <style>
      :root {
        --primary: #2d72d9;
        --primary-hover: #1b64ce;
        --text-dark: #1f2933;
        --text-muted: #56616f;
        --surface: #ffffff;
        --bg: linear-gradient(135deg, rgba(45, 114, 217, 0.14), rgba(46, 182, 125, 0.08));
        --shadow: 0 18px 48px rgba(15, 23, 42, 0.16);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Inter", "Segoe UI", Arial, sans-serif;
        color: var(--text-dark);
        min-height: 100vh;
        background: var(--bg);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 16px;
      }

      .hero {
        background: var(--surface);
        border-radius: 20px;
        padding: 56px 56px 48px;
        max-width: 960px;
        width: min(100%, 960px);
        box-shadow: var(--shadow);
        display: grid;
        gap: 24px;
      }

      .hero h1 {
        font-size: clamp(32px, 4vw, 46px);
        margin: 0;
        line-height: 1.15;
      }

      .hero p {
        margin: 0;
        font-size: 18px;
        color: var(--text-muted);
        max-width: 720px;
      }

      .cta {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        margin-top: 16px;
      }

      .cta a {
        padding: 14px 24px;
        border-radius: 12px;
        font-weight: 600;
        text-decoration: none;
        transition: transform 0.2s ease, background 0.2s ease, color 0.2s ease;
      }

      .cta a.primary {
        background: var(--primary);
        color: #fff;
      }

      .cta a.primary:hover,
      .cta a.primary:focus-visible {
        background: var(--primary-hover);
        transform: translateY(-1px);
      }

      .cta a.secondary {
        background: rgba(45, 114, 217, 0.08);
        color: var(--primary);
      }

      .cta a.secondary:hover,
      .cta a.secondary:focus-visible {
        background: rgba(45, 114, 217, 0.16);
        transform: translateY(-1px);
      }

      @media (max-width: 720px) {
        .hero {
          padding: 40px 28px;
        }

        .cta {
          flex-direction: column;
          align-items: stretch;
        }
      }
    </style>
  </head>
  <body>
    <section class="hero">
      <h1>Build modern authentication flows in minutes</h1>
      <p>
        This demo project showcases a polished sign-up and sign-in experience. Jump into your account, invite team
        members, and stay productive with streamlined access control.
      </p>
      <div class="cta">
        <a class="primary" href="login.html">Access your workspace</a>
        <a class="secondary" href="signup.html">Create a new account</a>
      </div>
    </section>
  </body>
</html>
