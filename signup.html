<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Create your account</title>
    <link rel="stylesheet" href="styles/auth.css" />
  </head>
  <body>
    <main class="auth-card" role="main">
      <header>
        <h1>Create your account</h1>
        <p>Join the workspace and collaborate seamlessly with your team.</p>
      </header>
      <form method="post">
        <!-- TODO: set action to backend signup endpoint -->
        <!-- TODO: add server-side validation & proper error handling -->
        <!-- TODO: include CSRF protection token/input when wiring backend -->
        <div class="form-group">
          <label for="su-username">Username</label>
          <input
            id="su-username"
            name="username"
            type="text"
            class="form-control"
            placeholder="Choose a username"
            autocomplete="username"
            required
          />
        </div>
        <div class="form-group">
          <label for="su-email">Email</label>
          <input
            id="su-email"
            name="email"
            type="email"
            class="form-control"
            placeholder="you@example.com"
            autocomplete="email"
            required
          />
        </div>
        <div class="form-group">
          <label for="su-password">Password</label>
          <input
            id="su-password"
            name="password"
            type="password"
            class="form-control"
            placeholder="Create a password"
            autocomplete="new-password"
            required
          />
          <p class="form-help">Use at least 8 characters, including a number and symbol.</p>
        </div>
        <div class="form-group">
          <label for="su-confirm">Confirm password</label>
          <input
            id="su-confirm"
            name="confirm"
            type="password"
            class="form-control"
            placeholder="Re-enter your password"
            autocomplete="new-password"
            required
          />
        </div>
        <button class="btn btn-success" type="submit">Create account</button>
      </form>
      <p class="secondary-text">
        Already have an account?
        <a id="login-link" href="login.html">Log in</a>
      </p>
    </main>
  </body>
</html>
