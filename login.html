<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Log in to your account</title>
    <link rel="stylesheet" href="styles/auth.css" />
  </head>
  <body>
    <main class="auth-card" role="main">
      <header>
        <h1>Welcome back</h1>
        <p>Sign in to access your dashboard, manage your projects, and stay up to date.</p>
      </header>
      <form method="post">
        <!-- TODO: set form action to the backend session/login endpoint -->
        <!-- TODO: surface form errors returned from the server -->
        <!-- TODO: inject CSRF token when wiring up the backend -->
        <div class="form-group">
          <label for="login-identifier">Email or username</label>
          <input
            id="login-identifier"
            name="identifier"
            type="text"
            class="form-control"
            placeholder="you@example.com"
            autocomplete="username"
            required
          />
          <p class="form-help">Use the email associated with your account or your unique username.</p>
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input
            id="login-password"
            name="password"
            type="password"
            class="form-control"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          />
        </div>
        <div class="form-actions">
          <label class="checkbox-field" for="remember-me">
            <input id="remember-me" name="remember" type="checkbox" value="true" />
            Keep me signed in
          </label>
          <div class="helper-links">
            <a id="forgot-password-link" href="#" aria-label="Reset your password">Forgot password?</a>
          </div>
        </div>
        <button class="btn btn-primary" type="submit">Continue</button>
      </form>
      <div class="divider">Or continue with</div>
      <div class="social-auth">
        <button type="button" aria-label="Continue with Google">
          <span aria-hidden="true">🔐</span>
          Continue with Google
        </button>
        <button type="button" aria-label="Continue with GitHub">
          <span aria-hidden="true">🐙</span>
          Continue with GitHub
        </button>
      </div>
      <p class="secondary-text">
        Don't have an account yet?
        <a id="signup-link" href="signup.html">Create one now</a>
      </p>
    </main>
  </body>
</html>
